name: Coletar base do OCAD no SICAF (app.wprelocad)

on:
  schedule:
    # 09:30 no horário de Brasília (UTC-3) / 07:30 no Acre (UTC-5) = 12:30 UTC, de segunda a sexta.
    - cron: "30 12 * * 1-5"
  workflow_dispatch:
    inputs:
      mes:
        description: "Mês de referência 1-12 (vazio = mês corrente em Rio Branco)"
        required: false
        default: ""
      dry_run:
        description: "Simular sem gravar arquivos nem fazer commit"
        type: boolean
        required: false
        default: false
      force:
        description: "Ignorar trava de queda na quantidade de ações"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: coletar-sicaf-ocad
  cancel-in-progress: false

jobs:
  coletar:
    name: Coletar OCAD (app.wprelocad)
    runs-on: [self-hosted, seplan-sicaf]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm ci

      - name: Verificar segredos do SICAF
        env:
          SICAF_CPF: ${{ secrets.SICAF_CPF }}
          SICAF_SENHA: ${{ secrets.SICAF_SENHA }}
        run: |
          if [ -z "$SICAF_CPF" ] || [ -z "$SICAF_SENHA" ]; then
            echo "::error::Configure SICAF_CPF e SICAF_SENHA em Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Coletar relatório OCAD no SICAF
        env:
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/scripts/certs/sectigo-ov-r36.pem
          SICAF_CPF: ${{ secrets.SICAF_CPF }}
          SICAF_SENHA: ${{ secrets.SICAF_SENHA }}
          INPUT_MES: ${{ inputs.mes }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          ARGS=()
          if [ -n "$INPUT_MES" ]; then
            ARGS+=("--mes=$INPUT_MES")
          fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS+=("--dry-run")
          fi
          if [ "$INPUT_FORCE" = "true" ]; then
            ARGS+=("--force")
          fi
          npm run dados:sicaf -- "${ARGS[@]}"

      - name: Verificar alterações em data/
        id: diff
        run: |
          if [ -n "$(git status --porcelain data/base-ocad.json data/base-ocad.meta.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validar integridade da base
        if: steps.diff.outputs.changed == 'true'
        run: npm run dados:validar

      - name: Verificar TypeScript e build do Next.js
        if: steps.diff.outputs.changed == 'true'
        run: |
          npx tsc --noEmit
          npm run build

      - name: Commitar e publicar atualização
        if: steps.diff.outputs.changed == 'true' && inputs.dry_run != true
        run: |
          DATA_CORTE=$(node -e "console.log(require('./data/base-ocad.meta.json').dataArquivo)")
          ANO_BASE=$(node -e "console.log(require('./data/base-ocad.meta.json').anos.join(','))")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/base-ocad.json data/base-ocad.meta.json
          git commit -m "chore(dados): atualiza base OCAD ${ANO_BASE} via SICAF (${DATA_CORTE})"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
